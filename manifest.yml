modules:
  jira:dashboardGadget:
    - key: element-ticket-report-gadget
      title: Ticket Report Gadget
      description: Dashboard gadget (ticket report)
      resource: main
      resolver:
        function: gadget-resolver
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      refreshable: true
  function:
    - key: gadget-resolver
      handler: backend/index.handler
resources:
  - key: main
    path: dist/frontend
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/998a2e13-f55b-42f9-955e-b1423e9eec52
